<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 가계부 — 주소가 바뀌었어요</title>
<!--
  이 파일은 옛 GitHub Pages 주소(doodoodoo0812.github.io/gagyebu)용 안내 페이지다.
  실제 앱은 public/index.html 이고 Cloudflare Worker가 서빙한다.
  이 페이지를 없애면 홈 화면에 옛 아이콘을 남겨둔 사람이 이유도 모르고 빈 화면을 보게 된다.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0f1628; color:#e8ecf5; text-align:center; padding:24px;
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .card { max-width:420px; }
  .logo { font-size:56px; margin-bottom:8px; }
  h1 { font-size:22px; margin:0 0 12px; }
  p { font-size:15px; line-height:1.7; color:#aab4c8; margin:0 0 24px; }
  a.go {
    display:block; padding:16px; border-radius:12px; background:#4ecdc4; color:#0f1628;
    font-size:17px; font-weight:700; text-decoration:none;
  }
  a.go:active { transform:scale(0.98); }
  .hint { margin-top:20px; font-size:13px; color:#7c8798; line-height:1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">💰</div>
    <h1>새 주소로 옮겼어요</h1>
    <p>
      가계부가 더 빠르고 안전한 곳으로 이사했습니다.<br>
      아래 버튼으로 들어가 주세요.
    </p>
    <a class="go" id="go" href="https://gagyebu.mandoo0812.workers.dev/">새 주소로 이동 →</a>
    <div class="hint">
      아이폰이라면 새 주소에서 <b>Safari</b> 공유 버튼(□↑) → <b>홈 화면에 추가</b>를 다시 해주세요.<br>
      홈 화면의 옛 아이콘은 지우셔도 됩니다.
    </div>
  </div>
</body>
</html>
