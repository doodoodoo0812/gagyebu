# Cloudflare Workers 배포 설정 (운영: gagyebu)
#   배포:        npx wrangler deploy
#   스키마 적용: npx wrangler d1 execute gagyebu --remote --file=schema.sql
name = "gagyebu"
main = "_worker.js"
# 설치된 wrangler(4.85.0)의 로컬 런타임이 지원하는 최신 날짜. 더 뒤로 잡으면 wrangler dev가 뜨지 않는다.
# 이 Worker가 쓰는 기능(crypto.subtle·D1·정적 자산)은 모두 이 날짜 이전부터 있던 것이라 올릴 이유가 없다.
compatibility_date = "2026-05-01"

# ──────── 정적 파일 (앱) ────────
#  artclass는 directory="./"로 폴더 전체를 올리지만, 그러면 _worker.js·schema.sql까지
#  공개 주소로 받아갈 수 있다. 앱만 public/에 두고 그 폴더만 노출한다.
#  (루트 index.html은 옛 GitHub Pages 주소용 이사 안내 페이지 — 배포에 포함되지 않는다)
[assets]
directory = "./public"
binding = "ASSETS"
# 기본값이면 정적 파일이 워커를 거치지 않고 바로 나간다. 그러면 HTML에 배포 버전을 심을 수 없어
# 앱이 '새 버전이 나왔는지'를 영영 모른다. 워커를 먼저 태워 HTML만 손대고 나머지는 그대로 통과시킨다.
# HTML만 워커를 태운다. true로 두면 아이콘·sw.js·manifest까지 전부 워커를 거쳐
# 요청 수와 지연이 공연히 늘어난다(버전을 심을 곳은 HTML뿐이다).
run_worker_first = ["/", "/index.html"]

# ──────── 배포 버전 (새 버전 알림용) ────────
#  배포할 때마다 자동으로 바뀌는 식별자. 앱이 자기가 받은 버전과 서버 버전을 비교해
#  다르면 "새 버전이 있어요"를 띄운다. 수동으로 번호를 올릴 필요가 없다(깜빡하면 무용지물이므로).
[version_metadata]
binding = "CF_VERSION_METADATA"

# ──────── 매일 기록 알림 (Cron) ────────
#  예전엔 앱 안의 setInterval로 알림을 띄웠는데, 그건 앱이 켜져 있을 때만 돌고
#  아이폰은 백그라운드로 가면 바로 얼린다(게다가 iOS는 new Notification()을 지원하지 않는다).
#  그래서 서버가 시각을 보고 푸시를 보낸다. 10분마다 깨어나 '설정한 시각이 지났고 오늘 아직 안 보냈으면' 보낸다.
[triggers]
# */10 = 매일 기록 알림/금액입력 알림.  0 0 1 * * = 매월 1일 09:00(KST) 전체 백업 이메일.
crons = ["*/10 * * * *", "0 0 1 * *"]

# ──────── D1 (거래·예산 저장소) ────────
#  Supabase 무료 플랜은 7일만 안 써도 정지되고 90일이 지나면 복구조차 안 된다.
#  실제로 2026-07-16에 그 일이 벌어져 기존 프로젝트를 되살리지 못했다. D1은 정지가 없다.
[[d1_databases]]
binding = "DB"
database_name = "gagyebu"
database_id = "e9475fb8-a10b-4fe5-adee-1e6645b56dab"

# ──────── 비밀값 ────────
# ⚠️ 여기에 적지 말 것. Cloudflare secret으로 관리한다.
#     npx wrangler secret put APP_PASSWORD     # 부부 공유 비밀번호
#     npx wrangler secret put SESSION_SECRET   # 세션 토큰 서명키(아무 긴 랜덤 문자열)
#  APP_PASSWORD를 잊으면 앱에 못 들어간다. SESSION_SECRET을 바꾸면 모든 기기가 로그아웃된다.
